databases:
  - name: rentease-db
    plan: free
    databaseName: rentease
    user: rentease
services:
  - type: web
    name: rentease-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rentease-db
          property: connectionString
      - key: SECRET
        generateValue: true
