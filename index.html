<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f7a55"><link rel="icon" href="icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RentEase - Rent Manager</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1b2b24;--mu:#6b7a72;--pr:#0f7a55;--pr2:#e3f4ec;--rd:#c0392b;--rd2:#fdeceb;--bd:#e2e6e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b2420;--tx:#e8efe9;--mu:#93a39a;--pr:#3ec28f;--pr2:#16342a;--rd:#ff7b6b;--rd2:#3a1f1c;--bd:#2a362f}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b2420;--tx:#e8efe9;--mu:#93a39a;--pr:#3ec28f;--pr2:#16342a;--rd:#ff7b6b;--rd2:#3a1f1c;--bd:#2a362f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
.w{max-width:560px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:16px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px}.due{color:var(--rd);font-weight:700}.ok{color:var(--pr);font-weight:700}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px;margin:4px 0 8px}
button{border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;background:var(--pr);color:#fff;cursor:pointer}
button.g{background:var(--pr2);color:var(--pr)}button.r{background:var(--rd2);color:var(--rd)}button.b{width:100%}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 2px;font-size:12px}.nav button.on{color:var(--pr)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}.stat b{font-size:20px;display:block}
.m{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}.m>div{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:90%;overflow:auto}
.btn{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;background:var(--pr);color:#fff;margin-bottom:8px}.btn.g{background:var(--pr2);color:var(--pr)}.btn.two{background:#1f6fd1}
.hist{font-size:12px;color:var(--mu);margin-top:6px}
.login{max-width:360px;margin:12vh auto;padding:0 16px}
.hero{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#0c6b4b,#17a778);color:#fff;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 10px 22px #0f7a5538}
.hero h1{font-size:21px}.hero .sub{font-size:12px;opacity:.85;margin-top:2px}.lo{background:#ffffff2b;color:#fff;padding:8px 13px;font-size:13px;border-radius:999px}
.w{padding-bottom:110px}h2{font-size:15px;color:var(--mu);margin:18px 2px 8px;font-weight:700}
.card,.stat{border-radius:18px;box-shadow:0 1px 2px #0000000d,0 8px 18px #0000000b}
.stat.s1{grid-column:1/-1;background:var(--rd2);border-color:transparent}.stat.s1 b{font-size:28px}.stat.s2{background:var(--pr2);border-color:transparent}
button{transition:transform .08s,opacity .15s;border-radius:12px}button:active{transform:scale(.96)}
input,select{border-radius:12px;padding:12px}input:focus,select:focus{outline:2px solid var(--pr);border-color:transparent}
.who{display:flex;align-items:center;gap:11px;min-width:0}.who b{font-size:15px}
.av{flex:none;width:44px;height:44px;border-radius:15px;background:var(--pr2);color:var(--pr);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;overflow:hidden;padding:0 3px}
.chip{display:inline-block;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700}.chip.bad{background:var(--rd2);color:var(--rd)}.chip.good{background:var(--pr2);color:var(--pr)}
.nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1px solid var(--bd);border-radius:22px;padding:6px;box-shadow:0 10px 28px #00000030}
.nav button{border-radius:16px;padding:8px 2px;font-size:11px;line-height:1.6}.nav button.on{background:var(--pr2)}
.m>div{border-radius:24px 24px 0 0;animation:up .22s ease}.m>div::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:var(--bd);margin:0 auto 14px}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.login{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:26px 22px;margin:9vh auto;width:calc(100% - 32px);box-shadow:0 14px 34px #0000001a}
.login h1{text-align:center;margin-bottom:4px}.login p.mu{text-align:center}.logo{font-size:46px;text-align:center}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#v{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}details summary::-webkit-details-marker{display:none}details summary::after{content:"＋";color:var(--pr);font-size:18px}details[open] summary::after{content:"－"}details[open] summary{margin-bottom:8px}
.search{background:var(--card);padding:13px 14px;margin:2px 0 10px}
.fcs{display:flex;gap:8px;margin:0 0 12px;overflow-x:auto}.fc{background:var(--card);color:var(--mu);border:1px solid var(--bd);padding:8px 15px;border-radius:999px;white-space:nowrap}.fc.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.mrow{padding-top:10px;border-top:1px solid var(--bd);margin-top:10px}.acts{display:flex;gap:8px;margin-top:12px}.acts button{flex:1}
.empty{text-align:center;padding:34px 16px}.empty .ei{font-size:46px;margin-bottom:6px}
.bar{height:10px;background:var(--pr2);border-radius:99px;overflow:hidden;margin:14px 0 8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#17a778,#0c6b4b);border-radius:99px;transition:width .6s}
.pct{font-size:24px;font-weight:800;color:var(--pr)}.card.prog{background:var(--card)}
.grid{margin-bottom:4px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const K='kirayakhata_v1';let db={admin:null,owner:{name:'',phone:''},renters:[],charges:[],pays:[]},view='home',authed=false;
try{const s=localStorage.getItem(K);if(s)db=JSON.parse(s)}catch(e){}
let ready=false,syncSt='local',pushT=null,ver=0,needSetup=false;
const DEF=()=>({owner:{name:'',phone:''},renters:[],charges:[],pays:[]});
const TK='rentease_token';
const getTok=()=>{try{return localStorage.getItem(TK)||''}catch(e){return ''}};
const setTok=t=>{try{t?localStorage.setItem(TK,t):localStorage.removeItem(TK)}catch(e){}};
async function api(m,p,b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+getTok()},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(e){}return{s:r.status,j}}
const paint=()=>{const e=$('#sync');if(e)e.textContent=({ok:'☁️ Synced across all devices',saving:'⏳ Saving…',err:'⚠️ Not synced - check internet',local:'📱 Offline'})[syncSt]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}syncSt='saving';paint();clearTimeout(pushT);pushT=setTimeout(push,300)};
async function push(){
 pushT=null;
 try{const {admin,...clean}=db;const r=await api('PUT','/state',{version:ver,data:clean});
  if(r.s==200){ver=r.j.version;syncSt='ok'}
  else if(r.s==409){await pull(true);render();toast('Updated from another device - please repeat your last change');return}
  else if(r.s==401){logout();return}
  else syncSt='err'}catch(e){syncSt='err'}
 paint();
}
async function pull(force){
 const r=await api('GET','/state');
 if(r.s==401){logout();return false}
 if(r.s!=200)throw new Error('pull failed');
 if(r.j.version===0){ver=0;delete db.admin;if(db.renters&&db.renters.length)push();else db=DEF();return true}
 if(force||r.j.version!==ver){
  try{const old=localStorage.getItem(K);if(old&&old!==JSON.stringify(r.j.data))localStorage.setItem(K+'_backup',old)}catch(e){}
  ver=r.j.version;db=Object.assign(DEF(),r.j.data);try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}return true}
 return false;
}
function logout(){setTok('');authed=false;render()}
async function poll(){
 if(!authed||pushT||document.hidden||document.getElementById('mod'))return;
 if(/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))return;
 try{if(await pull(false))render();syncSt='ok'}catch(e){syncSt='err'}paint();
}
setInterval(poll,10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
async function init(){
 try{const st=await api('GET','/status');needSetup=!st.j.setup;syncSt='ok';
  if(getTok()&&!needSetup){if(await pull(true))authed=true}}
 catch(e){syncSt='err'}
 ready=true;render();
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const tdy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const mon=()=>tdy().slice(0,7);
const fmtD=i=>{const [y,m,d]=String(i).split('-');return (+d)+'-'+(+m)+'-'+y.slice(2)};
const parseD=t=>{const a=String(t).trim().split(/[-\/.\s]+/).map(Number);if(a.length!=3||a.some(isNaN))return null;let [d,m,y]=a;if(y<100)y+=2000;const x=new Date(y,m-1,d);if(x.getFullYear()!=y||x.getMonth()!=m-1||x.getDate()!=d)return null;return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')};
const parseP=t=>{const a=String(t).trim().split(/[-\/.\s]+/).map(Number);if(a.some(isNaN))return null;if(a.length==3){const d=parseD(t);return d?{month:d.slice(0,7),date:d}:null}if(a.length==2){let [m,y]=a;if(y<100)y+=2000;if(m<1||m>12)return null;const mm=String(m).padStart(2,'0');return{month:y+'-'+mm,date:y+'-'+mm+'-01'}}return null};
const dueOf=(rid,t)=>db.charges.filter(c=>c.rid==rid&&c.type==t).reduce((a,c)=>a+c.amt,0)-db.pays.filter(p=>p.rid==rid&&p.type==t).reduce((a,p)=>a+p.amt,0);
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtM=m=>{const [y,mo]=String(m).split('-');return MN[+mo-1]+' '+y};
function monthly(rid,t){
 const m={};db.charges.filter(c=>c.rid==rid&&c.type==t).forEach(c=>{(m[c.month]=m[c.month]||{month:c.month,ch:0,pd:0}).ch+=c.amt});
 let pool=0;
 db.pays.filter(p=>p.rid==rid&&p.type==t).forEach(p=>{if(p.month&&m[p.month]){const x=Math.min(p.amt,Math.max(0,m[p.month].ch-m[p.month].pd));m[p.month].pd+=x;pool+=p.amt-x}else pool+=p.amt});
 const ks=Object.keys(m).sort();
 ks.forEach(k=>{const x=Math.min(pool,Math.max(0,m[k].ch-m[k].pd));m[k].pd+=x;pool-=x});
 return ks.map(k=>({...m[k],due:m[k].ch-m[k].pd}));
}
const mdues=(rid)=>['rent'].flatMap(t=>monthly(rid,t).filter(x=>x.due>0.0001).map(x=>({...x,t})));
let q='',flt='all',rq='';
const who=(r,sub)=>`<div class="who"><div class="av">${esc(r.room)}</div><div><b>${esc(r.name)}</b><div class="mu">${sub}</div></div></div>`;
const empty=(i,t,sub,b)=>`<div class="empty"><div class="ei">${i}</div><b>${t}</b><div class="mu">${sub}</div>${b||''}</div>`;
const TN={rent:'Rent'};

function render(){
 if(!authed)return loginUI();
 const nav=[['home','🏠','Home'],['renters','👥','Renters'],['rent','💰','Rent'],['dues','📋','Dues']];
 $('#app').innerHTML=`<div class="w"><div class="hero"><div><h1>🏘️ RentEase</h1><div class="sub">Your complete rent record in one place</div><div class="sub" id="sync"></div></div><button class="lo" onclick="logout()">Logout</button></div><div id="v"></div></div>
 <div class="nav">${nav.map(n=>`<button class="${view==n[0]?'on':''}" onclick="view='${n[0]}';render()">${n[1]}<br>${n[2]}</button>`).join('')}</div>`;
 ({home:homeV,renters:rentersV,rent:ledgerV,dues:duesV})[view]();paint();
}
function loginUI(){
 if(!ready){$('#app').innerHTML='<div class="login"><div class="logo">🏘️</div><h1>RentEase</h1><p class="mu">Loading… the server may take up to a minute to wake up on first open.</p></div>';return}
 const first=needSetup;
 $('#app').innerHTML=`<div class="login"><div class="logo">🏘️</div><h1>RentEase</h1><p class="mu">${first?'Welcome! Create your Admin ID and Password':'Sign in to manage your rentals'}</p>
 <input id="u" placeholder="Admin ID" autocomplete="username" onkeydown="if(event.key=='Enter')$('#p').focus()"><input id="p" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()">
 <div class="mu" style="text-align:right;cursor:pointer;margin:-2px 0 12px" onclick="const p=$('#p');p.type=p.type=='password'?'text':'password'">👁 Show / hide password</div>
 <button class="b" onclick="doLogin()">${first?'Create Admin':'Login'}</button><p id="er" class="due" style="text-align:center">${syncSt=='err'?'Cannot reach the server. Check your internet and reload.':''}</p></div>`;
}
async function doLogin(){
 const u=$('#u').value.trim(),p=$('#p').value;
 if(!u||p.length<4){$('#er').textContent='Enter an ID and a password of at least 4 characters';return}
 $('#er').textContent='Please wait…';
 try{const r=await api('POST',needSetup?'/setup':'/login',{u,p});
  if(r.s==403&&needSetup){needSetup=false;return doLogin()}
  if(r.s!=200){$('#er').textContent=r.j.error||'Login failed';return}
  setTok(r.j.token);needSetup=false;await pull(true);authed=true;syncSt='ok';render();
 }catch(e){$('#er').textContent='Cannot reach the server. Check your internet.'}
}
function homeV(){
 const m=mon(),rd=db.renters.reduce((a,r)=>a+Math.max(0,dueOf(r.id,'rent')),0);
 const exp=db.charges.filter(c=>c.type=='rent'&&c.month==m).reduce((a,c)=>a+c.amt,0);
 const col=db.pays.filter(p=>p.date.startsWith(m)).reduce((a,p)=>a+p.amt,0);
 const pct=exp?Math.min(100,Math.round(col/exp*100)):0;
 const pend=db.renters.filter(r=>dueOf(r.id,'rent')>0.0001);
 const byT={};db.pays.forEach(p=>{if(p.by)byT[p.by]=(byT[p.by]||0)+p.amt});const bl=Object.entries(byT).sort((a,b)=>b[1]-a[1]);
 const rec=db.pays.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
 $('#v').innerHTML=`<div class="card prog"><div class="row"><div><div class="mu">${new Date().toLocaleString('en-US',{month:'long',year:'numeric'})}</div><b style="font-size:26px">${inr(col)}</b> <span class="mu">collected</span></div><div class="pct">${pct}%</div></div><div class="bar"><i style="width:${pct}%"></i></div><div class="mu">${exp?inr(exp)+' charged this month':'No rent charged for this month yet'}</div></div>
 <div class="grid"><div class="stat s1"><span class="mu">📌 Total pending</span><b class="due">${inr(rd)}</b></div><div class="stat"><span class="mu">👥 Renters</span><b>${db.renters.length}</b></div><div class="stat"><span class="mu">⏳ With dues</span><b>${pend.length}</b></div></div>`
 +(db.renters.length?'':empty('🏠','Welcome to RentEase','Add your first renter to start tracking rent.',`<button style="margin-top:14px" onclick="view='renters';render()">+ Add renter</button>`))
 +(pend.length?`<h2>Pending payments</h2>`+pend.map(r=>`<div class="card row">${who(r,monthly(r.id,'rent').filter(x=>x.due>0.0001).map(x=>fmtM(x.month)+' '+inr(x.due)).join(', '))}</div>`).join(''):(db.renters.length?'<h2>Pending payments</h2><div class="card mu" style="text-align:center">All clear 🎉 Nobody has dues.</div>':''))
 +(bl.length?'<h2>Money collected by</h2>'+bl.map(([n,v])=>`<div class="card row"><div class="who"><div class="av">${esc(n.slice(0,2).toUpperCase())}</div><div><b>${esc(n)}</b><div class="mu">Total collected</div></div></div><b class="ok">${inr(v)}</b></div>`).join(''):'')
 +(rec.length?`<h2>Recent payments</h2>`+rec.map(p=>{const r=db.renters.find(x=>x.id==p.rid);return r?`<div class="card row">${who(r,fmtD(p.date)+(p.by?' · by '+esc(p.by):''))}<b class="ok">+${inr(p.amt)}</b></div>`:''}).join(''):'');
}
function rentersV(){
 $('#v').innerHTML=`<details class="card" ${db.renters.length?'':'open'}><summary>➕ Add new renter</summary><input id="rm" placeholder="Room number (e.g. 101)"><input id="nm" placeholder="Renter's name"><input id="ph" type="tel" placeholder="Phone number"><input id="rt" type="number" placeholder="Monthly rent (₹)"><button class="b" onclick="addR()">+ Add Renter</button></details>
 <h2>All renters (${db.renters.length})</h2><input class="search" placeholder="🔍 Search by name, room or phone" value="${esc(rq)}" oninput="rq=this.value;renterList()"><div id="rl"></div>`;
 renterList();
}
function renterList(){
 const ql=rq.trim().toLowerCase(),L=db.renters.filter(r=>!ql||(r.name+' '+r.room+' '+r.phone).toLowerCase().includes(ql));
 $('#rl').innerHTML=L.map(r=>`<div class="card row">${who(r,'Room '+esc(r.room)+' · '+esc(r.phone||'no phone')+' · '+inr(r.rent)+'/month')}<div style="display:flex;gap:6px"><button class="g" onclick="editR('${r.id}')">Edit</button><button class="r" onclick="delR('${r.id}')">Remove</button></div></div>`).join('')||empty('👥',db.renters.length?'No match':'No renters yet',db.renters.length?'Try a different search.':'Open "Add new renter" above.');
}
function editR(id){
 const r=db.renters.find(x=>x.id==id);
 modal(`<b>Edit renter</b><div class="mu" style="margin-top:8px">Room</div><input id="e1" value="${esc(r.room)}"><div class="mu">Name</div><input id="e2" value="${esc(r.name)}"><div class="mu">Phone</div><input id="e3" type="tel" value="${esc(r.phone)}"><div class="mu">Monthly rent (₹)</div><input id="e4" type="number" value="${r.rent}"><button class="b" onclick="saveR('${id}')">Save changes</button>`);
}
function saveR(id){
 const r=db.renters.find(x=>x.id==id),room=$('#e1').value.trim(),name=$('#e2').value.trim();
 if(!room||!name)return toast('Room number and name are required');
 r.room=room;r.name=name;r.phone=$('#e3').value.trim();r.rent=+$('#e4').value||0;save();closeM();render();toast('Renter updated');
}
function addR(){
 const r={id:uid(),room:$('#rm').value.trim(),name:$('#nm').value.trim(),phone:$('#ph').value.trim(),rent:+$('#rt').value||0};
 if(!r.room||!r.name)return toast('Room number and name are required');
 db.renters.push(r);save();render();toast('Renter added');
}
function delR(id){modal(`<b>Delete this renter?</b><p class="mu">This renter's entire record will be removed.</p><button class="r b" onclick="reallyDel('${id}')">Yes, delete</button><div style="height:8px"></div><button class="g b" onclick="closeM()">No</button>`)}
function reallyDel(id){db.renters=db.renters.filter(r=>r.id!=id);db.charges=db.charges.filter(c=>c.rid!=id);db.pays=db.pays.filter(p=>p.rid!=id);save();closeM();render()}
function ledgerV(){
 const chip=(k,t)=>`<button class="fc ${flt==k?'on':''}" onclick="flt='${k}';ledgerV()">${t}</button>`;
 $('#v').innerHTML=`<details class="card"><summary>⚡ Charge rent to all renters</summary><div class="mu" style="margin-top:6px">Date or month (e.g. 2-4-26 or 4-26)</div><input type="text" id="gm" inputmode="numeric" value="${fmtD(tdy())}"><button class="b" onclick="genRent()">Charge rent</button></details>
 <input class="search" placeholder="🔍 Search by name or room" value="${esc(q)}" oninput="q=this.value;ledgerList()"><div class="fcs">${chip('all','All')}${chip('due','Has dues')}${chip('paid','Cleared')}</div><div id="ll"></div>`;
 ledgerList();
}
function ledgerList(){
 const ql=q.trim().toLowerCase();
 const L=db.renters.filter(r=>(!ql||(r.name+' '+r.room).toLowerCase().includes(ql))&&(flt=='all'||(flt=='due'?dueOf(r.id,'rent')>0.0001:dueOf(r.id,'rent')<=0.0001)));
 $('#ll').innerHTML=L.map(r=>{
  const d=dueOf(r.id,'rent'),ms=monthly(r.id,'rent').slice().reverse();
  return `<div class="card"><div class="row">${who(r,'Room '+esc(r.room)+' · Rent '+inr(r.rent)+'/month')}<div class="${d>0.0001?'due':'ok'}" style="text-align:right">${d>0.0001?'Dues '+inr(d):d<-0.0001?'Advance '+inr(-d):'Clear ✔'}</div></div>
  ${ms.map(x=>`<div class="row mrow"><div><b>${fmtM(x.month)}</b><div class="mu">Rent ${inr(x.ch)} · Paid ${inr(x.pd)}</div></div><div style="text-align:right">${x.due>0.0001?`<span class="chip bad">Due ${inr(x.due)}</span><div><button style="margin-top:6px" onclick="payUI('${r.id}','rent','${x.month}')">Paid</button></div>`:'<span class="chip good">Paid ✔</span>'}</div></div>`).join('')||'<div class="mu" style="margin-top:10px">No rent charged yet.</div>'}
  <div class="acts"><button class="g" onclick="addRentUI('${r.id}')">+ Add Rent</button><button class="g" onclick="histUI('${r.id}','rent')">📜 History</button></div></div>`}).join('')||empty('🔍',db.renters.length?'Nothing here':'No renters yet',db.renters.length?'No renters match this search or filter.':'Add a renter in the Renters tab first.');
}
function duesV(){
 const L=db.renters.map(r=>({r,ms:monthly(r.id,'rent').filter(x=>x.due>0.0001)})).filter(x=>x.ms.length).sort((a,b)=>b.ms.reduce((p,x)=>p+x.due,0)-a.ms.reduce((p,x)=>p+x.due,0));
 const tot=L.reduce((a,x)=>a+x.ms.reduce((p,m)=>p+m.due,0),0);
 $('#v').innerHTML=`<h2>📋 Dues (Pending)</h2><div class="stat s1" style="margin-bottom:10px"><span class="mu">📌 Total pending</span><b class="due">${inr(tot)}</b></div>`+(L.map(({r,ms})=>`<div class="card"><div class="row"><div class="who"><div class="av">${esc(r.room)}</div><div><b>${esc(r.name)}</b><div class="mu">Room ${esc(r.room)}</div></div></div><b class="due">${inr(ms.reduce((p,x)=>p+x.due,0))}</b></div>
 ${ms.map(x=>`<div class="row" style="margin-top:8px"><div class="mu"><b>${fmtM(x.month)}</b> · Rent ${inr(x.ch)}, paid ${inr(x.pd)} → <span class="due">${inr(x.due)} due</span></div><button onclick="payUI('${r.id}','rent','${x.month}')">Paid</button></div>`).join('')}
 <div style="display:flex;gap:6px;margin-top:10px"><button class="g" onclick="histUI('${r.id}','rent')">📜 History</button></div></div>`).join('')||'<p class="mu">Nobody has dues 🎉</p>');
}
function genRent(){
 const p=parseP($('#gm').value);if(!p)return toast('Enter a valid date or month, e.g. 2-4-26 or 4-26');
 let n=0;db.renters.forEach(r=>{if(r.rent&&!db.charges.some(c=>c.rid==r.id&&c.type=='rent'&&c.month==p.month)){db.charges.push({id:uid(),rid:r.id,type:'rent',month:p.month,amt:r.rent,date:p.date});n++}});
 save();render();toast(n?fmtM(p.month)+' rent charged to '+n+' renter(s)':fmtM(p.month)+' rent is already charged');
}
function addRentUI(id){
 const r=db.renters.find(x=>x.id==id);
 modal(`<b>+ Add Rent · Room ${esc(r.room)} · ${esc(r.name)}</b><div class="mu" style="margin-top:8px">Date or month (e.g. 2-4-26 or 4-26)</div><input id="rd" type="text" inputmode="numeric" value="${fmtD(tdy())}"><div class="mu">Rent amount (₹)</div><input id="ra" type="number" value="${r.rent||''}"><button class="b" onclick="addRent('${id}')">Charge Rent</button>`);
}
function addRent(id){
 const p=parseP($('#rd').value),a=+$('#ra').value;
 if(!p)return toast('Enter a valid date or month, e.g. 2-4-26 or 4-26');if(!(a>0))return toast('Enter a valid amount');
 db.charges.push({id:uid(),rid:id,type:'rent',month:p.month,amt:a,date:p.date});save();closeM();render();toast(fmtM(p.month)+' rent charged');
}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:#1b2b24;color:#fff;padding:11px 16px;border-radius:12px;z-index:99;font-size:14px;max-width:90%;box-shadow:0 4px 14px #0005';document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function modal(h){const d=document.createElement('div');d.className='m';d.id='mod';d.onclick=e=>{if(e.target==d)d.remove()};d.innerHTML='<div>'+h+'</div>';document.body.appendChild(d)}
const closeM=()=>{const m=$('#mod');if(m)m.remove()};
function payUI(id,t,pm0){
 const r=db.renters.find(x=>x.id==id),ms=monthly(id,t).filter(x=>x.due>0.0001),d=Math.max(0,dueOf(id,t));
 const sel=ms.length?`<div class="mu">Which month is this payment for?</div><select id="pm" onchange="$('#amt').value=this.selectedOptions[0].dataset.d">${ms.map(x=>`<option value="${x.month}" data-d="${x.due}" ${x.month==pm0?'selected':''}>${fmtM(x.month)} (${inr(x.due)} due)</option>`).join('')}</select>`:'';
 modal(`<b>${TN[t]} · Room ${esc(r.room)} · ${esc(r.name)}</b><p class="mu">Total dues: ${inr(d)}</p>${sel}<div class="mu">Collected by (who received the money)</div><input id="pby" list="bys" placeholder="Name of person" value="${esc(db.lastBy||'')}"><datalist id="bys">${[...new Set(db.pays.map(p=>p.by).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist><div class="mu">Date (e.g. 2-4-26)</div><input id="pdt" type="text" inputmode="numeric" value="${fmtD(tdy())}"><input id="amt" type="number" placeholder="Amount received (₹)" value="${ms.length?(ms.find(x=>x.month==pm0)||ms[0]).due:''}"><button class="b" onclick="doPay('${id}','${t}')">Mark as Paid</button>`);
}
function doPay(id,t){
 const a=+$('#amt').value;if(!(a>0))return toast('Enter a valid amount');
 const date=parseD($('#pdt').value);if(!date)return toast('Enter a valid date, e.g. 2-4-26');
 const by=$('#pby').value.trim();if(!by)return toast('Enter the name of the person who collected the money');
 const r=db.renters.find(x=>x.id==id),pm=$('#pm')?$('#pm').value:'';
 db.pays.push({id:uid(),rid:id,type:t,amt:a,date,month:pm,by});db.lastBy=by;save();
 closeM();render();toast('Payment saved ✔');
}
function histUI(id,t){
 const r=db.renters.find(x=>x.id==id);if(!r)return closeM();
 const rows=[...db.charges.filter(c=>c.rid==id&&c.type==t).map(c=>({k:'c',id:c.id,d:c.date,amt:c.amt,s:`➕ Charged: ${esc(c.month)} ${esc(c.note||'')}`})),...db.pays.filter(p=>p.rid==id&&p.type==t).map(p=>({k:'p',id:p.id,d:p.date,amt:p.amt,s:`✅ Received${p.by?' by '+esc(p.by):''}`}))].sort((a,b)=>b.d.localeCompare(a.d));
 closeM();
 modal(`<b>📜 History · Room ${esc(r.room)} · ${esc(r.name)} · ${TN[t]}</b><p class="mu">Remove a wrong entry with 🗑. Dues update automatically.</p>`+(rows.map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><div>${x.s}<div class="mu">${fmtD(x.d)}</div></div><div style="display:flex;gap:8px;align-items:center"><b>${inr(x.amt)}</b><button class="r" onclick="delEntry('${x.k}','${x.id}','${id}','${t}')">🗑</button></div></div>`).join('')||'<p class="mu">No entries yet</p>')+`<div style="height:10px"></div><button class="g b" onclick="closeM()">Close</button>`);
}
function delEntry(k,eid,id,t){if(k=='c')db.charges=db.charges.filter(x=>x.id!=eid);else db.pays=db.pays.filter(x=>x.id!=eid);save();render();histUI(id,t);toast('Entry removed')}
if('serviceWorker' in navigator&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();init();
</script></body></html>
